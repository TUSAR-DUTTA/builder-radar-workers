name: Reusable consumer evidence canary

on:
  workflow_call:
    inputs:
      engine:
        required: true
        type: string
      private_commit:
        description: Exact 40-character private-core commit selected by the caller
        required: true
        type: string
      project_id:
        required: false
        type: string
        default: ''
      prompt_id:
        required: false
        type: string
        default: ''
      preflight_only:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PRIVATE_INGESTION_COMMIT: ${{ inputs.private_commit }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GROQ_8B_KEY_1: ${{ secrets.GROQ_8B_KEY_1 }}
      GROQ_8B_KEY_2: ${{ secrets.GROQ_8B_KEY_2 }}
      GROQ_8B_KEY_3: ${{ secrets.GROQ_8B_KEY_3 }}
      GROQ_8B_KEY_4: ${{ secrets.GROQ_8B_KEY_4 }}
      GROQ_70B_KEY_1: ${{ secrets.GROQ_70B_KEY_1 }}
      GROQ_70B_KEY_2: ${{ secrets.GROQ_70B_KEY_2 }}
      GROQ_70B_KEY_3: ${{ secrets.GROQ_70B_KEY_3 }}
      PLAYWRIGHT_BROWSER_CHANNEL: chrome
      PLAYWRIGHT_HEADLESS: '0'
      PLAYWRIGHT_MARKET: US
      PLAYWRIGHT_PROXY_SERVER: ${{ secrets.PLAYWRIGHT_PROXY_SERVER }}
      PLAYWRIGHT_PROXY_USERNAME: ${{ secrets.PLAYWRIGHT_PROXY_USERNAME }}
      PLAYWRIGHT_PROXY_PASSWORD: ${{ secrets.PLAYWRIGHT_PROXY_PASSWORD }}
      PLAYWRIGHT_SESSIONS_DIR: /tmp/playwright_sessions
      PLAYWRIGHT_DEBUG_DIR: /tmp/playwright_debug

    steps:
      - name: Check out worker commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate and stage exact private runtime
        uses: ./.github/actions/stage-private-runtime
        with:
          private_commit: ${{ inputs.private_commit }}
          core_token: ${{ secrets.CORE_REPO_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and validate deterministic gates
        run: |
          npm ci
          npm run verify:evidence-contract
          npm run typecheck:workers

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore only the selected provider session
        env:
          ENGINE: ${{ inputs.engine }}
          CHATGPT_SESSION_GZ_B64: ${{ inputs.engine == 'chatgpt' && secrets.CHATGPT_SESSION_GZ_B64 || '' }}
          CHATGPT_SESSION_B64: ${{ inputs.engine == 'chatgpt' && secrets.CHATGPT_SESSION_B64 || '' }}
          CLAUDE_SESSION_GZ_B64: ${{ inputs.engine == 'claude' && secrets.CLAUDE_SESSION_GZ_B64 || '' }}
          CLAUDE_SESSION_B64: ${{ inputs.engine == 'claude' && secrets.CLAUDE_SESSION_B64 || '' }}
          PERPLEXITY_SESSION_GZ_B64: ${{ inputs.engine == 'perplexity' && secrets.PERPLEXITY_SESSION_GZ_B64 || '' }}
          PERPLEXITY_SESSION_B64: ${{ inputs.engine == 'perplexity' && secrets.PERPLEXITY_SESSION_B64 || '' }}
          GROK_SESSION_GZ_B64: ${{ inputs.engine == 'grok' && secrets.GROK_SESSION_GZ_B64 || '' }}
          GROK_SESSION_B64_1: ${{ inputs.engine == 'grok' && secrets.GROK_SESSION_B64_1 || '' }}
          GROK_SESSION_B64_2: ${{ inputs.engine == 'grok' && secrets.GROK_SESSION_B64_2 || '' }}
          GROK_SESSION_B64_3: ${{ inputs.engine == 'grok' && secrets.GROK_SESSION_B64_3 || '' }}
          GROK_SESSION_B64_4: ${{ inputs.engine == 'grok' && secrets.GROK_SESSION_B64_4 || '' }}
          GROK_SESSION_B64_5: ${{ inputs.engine == 'grok' && secrets.GROK_SESSION_B64_5 || '' }}
          GOOGLE_SESSION_GZ_B64: ${{ inputs.engine == 'google-aio' && secrets.GOOGLE_SESSION_GZ_B64 || '' }}
          GOOGLE_SESSION_B64: ${{ inputs.engine == 'google-aio' && secrets.GOOGLE_SESSION_B64 || '' }}
        run: |
          mkdir -p /tmp/playwright_sessions /tmp/playwright_debug
          node scripts/restore-provider-session.mjs "$ENGINE" /tmp/playwright_sessions

      - name: Run one exact provider acquisition preflight
        if: inputs.preflight_only
        env:
          PREFLIGHT_ENGINE: ${{ inputs.engine }}
          SCRAPE_PROJECT_ID: ${{ inputs.project_id }}
          SCRAPE_PROMPT_ID: ${{ inputs.prompt_id }}
        run: xvfb-run -a npx tsx scripts/run-consumer-adapter-preflight.ts

      - name: Run one exact provider/project/prompt persistence canary
        if: ${{ !inputs.preflight_only }}
        env:
          SCRAPE_PROJECT_ID: ${{ inputs.project_id }}
          SCRAPE_PROMPT_ID: ${{ inputs.prompt_id }}
          SCRAPE_SOURCES: ${{ inputs.engine }}
          EVIDENCE_CANARY: ${{ inputs.project_id != '' && '1' || '0' }}
        run: xvfb-run -a npx tsx src/workers/runner.ts

      - name: Write safe execution summary
        if: always()
        shell: bash
        env:
          ENGINE: ${{ inputs.engine }}
          PROJECT_ID: ${{ inputs.project_id }}
          PROMPT_ID: ${{ inputs.prompt_id }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
        run: |
          {
            echo "## Consumer evidence canary"
            echo "- worker_sha: $GITHUB_SHA"
            echo "- private_sha: $PRIVATE_INGESTION_COMMIT"
            echo "- engine: $ENGINE"
            echo "- project_id: $PROJECT_ID"
            echo "- prompt_id: $PROMPT_ID"
            echo "- mode: $([ "$PREFLIGHT_ONLY" = "true" ] && echo acquisition_only_preflight || echo persistence_canary)"
            echo "- acquisition_limit: 1"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bounded redacted diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-canary-${{ inputs.engine }}-${{ github.run_id }}
          path: /tmp/playwright_debug
          if-no-files-found: ignore
          retention-days: 3
