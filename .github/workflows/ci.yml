name: Worker compatibility CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVATE_INGESTION_COMMIT: ${{ vars.PRIVATE_INGESTION_COMMIT }}
      PLAYWRIGHT_DEBUG_DIR: /tmp/playwright_debug
    steps:
      - name: Check out worker commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate and stage exact private runtime
        uses: ./.github/actions/stage-private-runtime
        with:
          private_commit: ${{ vars.PRIVATE_INGESTION_COMMIT }}
          core_token: ${{ secrets.CORE_REPO_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install Chromium for adapter fixtures
        run: npx playwright install --with-deps chromium

      - name: Verify evidence contract integrity
        run: npm run verify:evidence-contract

      - name: Run complete deterministic test suite
        run: npm test

      - name: Typecheck worker runtime
        run: npm run typecheck:workers

      - name: Lint worker, contract, test, and verification code
        run: npm run lint

      - name: Build and verify package contents
        run: npm run build

      - name: Verify clean patch whitespace
        run: git diff --check

      - name: Upload bounded test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: worker-ci-diagnostics-${{ github.run_id }}
          path: /tmp/playwright_debug
          if-no-files-found: ignore
          retention-days: 3
