name: Worker compatibility CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVATE_INGESTION_COMMIT: ${{ vars.PRIVATE_INGESTION_COMMIT }}
    steps:
      - name: Checkout worker
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact worker dependencies
        run: npm ci

      - name: Verify evidence-contract version and integrity
        run: npm run verify:evidence-contract

      - name: Fetch private runtime
        uses: actions/checkout@v4
        with:
          repository: TUSAR-DUTTA/Builder-Radar
          ref: ${{ vars.PRIVATE_INGESTION_COMMIT || 'main' }}
          token: ${{ secrets.CORE_REPO_PAT }}
          path: _core

      - name: Verify private consumer pin
        run: |
          if [ -n "$PRIVATE_INGESTION_COMMIT" ]; then
            test "$(git -C _core rev-parse HEAD)" = "$PRIVATE_INGESTION_COMMIT"
          fi
          node -e "const worker=require('./package.json'); const core=require('./_core/package.json'); const name='@builder-radar/evidence-contract'; if (worker.dependencies[name] && core.dependencies[name] && worker.dependencies[name] !== core.dependencies[name]) throw new Error('private and worker evidence-contract pins differ')"

      - name: Stage pinned private runtime implementation
        run: |
          cp -r _core/src/db src/db
          cp -r _core/src/lib src/lib
          if [ -d _core/src/types ]; then cp -r _core/src/types src/types; fi
          rm -rf _core

      - name: Install Chromium before browser-dependent tests
        run: npx playwright install --with-deps chromium

      - name: Run shared worker contract tests
        run: npm run test:worker-contracts

      - name: Run existing browser contract tests
        run: npm run test:worker-browser-contracts

      - name: Typecheck workers explicitly
        run: npm run typecheck:workers

      - name: Lint intended worker and contract files
        run: npm run lint

      - name: Verify patch whitespace
        run: git diff --check
