name: Worker compatibility CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      canary_private_commit:
        description: Exact 40-character private-core commit for this CI canary only
        required: true
        type: string

permissions:
  contents: read

jobs:
  production-compatibility:
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/_compatibility-ci.yml
    with:
      private_commit: ${{ vars.PRODUCTION_PRIVATE_INGESTION_COMMIT }}
    secrets: inherit

  canary-compatibility:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_compatibility-ci.yml
    with:
      private_commit: ${{ inputs.canary_private_commit }}
    secrets: inherit
