name: Test Claude & Perplexity (WITH Webshare Proxy)

on:
  workflow_dispatch:

jobs:
  test-models:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PLAYWRIGHT_BROWSER_CHANNEL: chrome
      PLAYWRIGHT_HEADLESS: '1'
      PLAYWRIGHT_DEBUG_DIR: /tmp/playwright_debug
      PLAYWRIGHT_PREFER_EXISTING_SESSION_FILE: '1'
      PLAYWRIGHT_PROXY_SERVER: ${{ secrets.PLAYWRIGHT_PROXY_SERVER }}
      PLAYWRIGHT_PROXY_USERNAME: ${{ secrets.PLAYWRIGHT_PROXY_USERNAME }}
      PLAYWRIGHT_PROXY_PASSWORD: ${{ secrets.PLAYWRIGHT_PROXY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch private core (read-only, runtime only)
        uses: actions/checkout@v4
        with:
          repository: TUSAR-DUTTA/Builder-Radar
          ref: main
          token: ${{ secrets.CORE_REPO_PAT }}
          path: _core
      - name: Stage private core into src/ (never committed)
        run: |
          cp -r _core/src/db src/db
          cp -r _core/src/lib src/lib
          if [ -d _core/src/types ]; then cp -r _core/src/types src/types; fi
          rm -rf _core
      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Log browser runtime
        run: |
          google-chrome --version
          npx playwright --version

      - name: Restore sessions from secrets
        run: |
          mkdir -p playwright_sessions
          mkdir -p /tmp/playwright_debug
          if [ -n "${{ secrets.CLAUDE_SESSION_B64 }}" ]; then
            echo "${{ secrets.CLAUDE_SESSION_B64 }}" | base64 -d > playwright_sessions/claude_auth_state.json
            echo "Claude session restored"
          fi
          if [ -n "${{ secrets.PERPLEXITY_SESSION_B64 }}" ]; then
            echo "${{ secrets.PERPLEXITY_SESSION_B64 }}" | base64 -d > playwright_sessions/perplexity_auth_state.json
            echo "Perplexity session restored"
          fi

      - name: Run test script
        env:
          CLAUDE_SESSION_B64: ${{ secrets.CLAUDE_SESSION_B64 }}
          PERPLEXITY_SESSION_B64: ${{ secrets.PERPLEXITY_SESSION_B64 }}
        run: xvfb-run -a npx tsx test-cp.ts
