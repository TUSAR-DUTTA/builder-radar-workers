name: Test Scrapers

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run scrapers
        env:
          PLAYWRIGHT_HEADLESS: '1'
          PLAYWRIGHT_BROWSER_CHANNEL: 'chrome'
          PLAYWRIGHT_PROXY_SERVER: ${{ secrets.PLAYWRIGHT_PROXY_SERVER }}
          PLAYWRIGHT_PROXY_USERNAME: ${{ secrets.PLAYWRIGHT_PROXY_USERNAME }}
          PLAYWRIGHT_PROXY_PASSWORD: ${{ secrets.PLAYWRIGHT_PROXY_PASSWORD }}
          CHATGPT_SESSION_B64: ${{ secrets.CHATGPT_SESSION_B64 }}
          CLAUDE_SESSION_B64: ${{ secrets.CLAUDE_SESSION_B64 }}
          PERPLEXITY_SESSION_B64: ${{ secrets.PERPLEXITY_SESSION_B64 }}
          GOOGLE_SESSION_B64: ${{ secrets.GOOGLE_SESSION_B64 }}
          DEEPSEEK_SESSION_B64: ${{ secrets.DEEPSEEK_SESSION_B64 }}
          GROK_SESSION_B64: ${{ secrets.GROK_SESSION_B64 }}
        run: |
          xvfb-run -a npx tsx test-scrapers.ts
