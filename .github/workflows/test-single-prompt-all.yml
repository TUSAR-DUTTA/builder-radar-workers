name: Test One Worker - Exact Project Prompt
on:
  workflow_dispatch:
    inputs:
      engine:
        description: One exact provider adapter
        required: true
        type: choice
        options: [chatgpt, claude, perplexity, grok, google-aio]
      project_id:
        description: Exact project UUID
        required: true
        type: string
      prompt_id:
        description: Exact active prompt UUID
        required: true
        type: string
jobs:
  canary:
    uses: ./.github/workflows/_consumer-canary.yml
    with:
      engine: ${{ inputs.engine }}
      project_id: ${{ inputs.project_id }}
      prompt_id: ${{ inputs.prompt_id }}
      preflight_only: true
    secrets: inherit
