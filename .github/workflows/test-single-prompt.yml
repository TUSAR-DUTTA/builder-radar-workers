name: Test All Workers Single Prompt

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'The single prompt to test'
        required: true
        default: 'What is Builder Radar and what are its features?'

jobs:
  test-workers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    env:
      PLAYWRIGHT_BROWSER_CHANNEL: chrome
      PLAYWRIGHT_HEADLESS: '0'
      PLAYWRIGHT_PROXY_SERVER: ${{ secrets.PLAYWRIGHT_PROXY_SERVER }}
      PLAYWRIGHT_PROXY_USERNAME: ${{ secrets.PLAYWRIGHT_PROXY_USERNAME }}
      PLAYWRIGHT_PROXY_PASSWORD: ${{ secrets.PLAYWRIGHT_PROXY_PASSWORD }}
      PLAYWRIGHT_SESSIONS_DIR: /tmp/playwright_sessions

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers and dependencies
        run: npx playwright install --with-deps chromium

      - name: Restore sessions from secrets
        run: |
          mkdir -p /tmp/playwright_sessions
          # ChatGPT
          if [ -n "${{ secrets.CHATGPT_SESSION_GZ_B64 }}" ]; then
            echo "${{ secrets.CHATGPT_SESSION_GZ_B64 }}" | base64 -d | gunzip > /tmp/playwright_sessions/chatgpt_auth_state.json
          elif [ -n "${{ secrets.CHATGPT_SESSION_B64 }}" ]; then
            echo "${{ secrets.CHATGPT_SESSION_B64 }}" | base64 -d > /tmp/playwright_sessions/chatgpt_auth_state.json
          fi
          # Claude
          if [ -n "${{ secrets.CLAUDE_SESSION_B64 }}" ]; then
            echo "${{ secrets.CLAUDE_SESSION_B64 }}" | base64 -d > /tmp/playwright_sessions/claude_auth_state.json
          fi
          # Perplexity
          if [ -n "${{ secrets.PERPLEXITY_SESSION_GZ_B64 }}" ]; then
            echo "${{ secrets.PERPLEXITY_SESSION_GZ_B64 }}" | base64 -d | gunzip > /tmp/playwright_sessions/perplexity_auth_state.json
          elif [ -n "${{ secrets.PERPLEXITY_SESSION_B64 }}" ]; then
            echo "${{ secrets.PERPLEXITY_SESSION_B64 }}" | base64 -d > /tmp/playwright_sessions/perplexity_auth_state.json
          fi
          # Google AIO
          if [ -n "${{ secrets.GOOGLE_SESSION_B64 }}" ]; then
            echo "${{ secrets.GOOGLE_SESSION_B64 }}" | base64 -d > /tmp/playwright_sessions/google_auth_state.json
          fi
          # Grok
          if [ -n "${{ secrets.GROK_SESSION_B64_1 }}" ]; then
            echo "${{ secrets.GROK_SESSION_B64_1 }}${{ secrets.GROK_SESSION_B64_2 }}${{ secrets.GROK_SESSION_B64_3 }}${{ secrets.GROK_SESSION_B64_4 }}${{ secrets.GROK_SESSION_B64_5 }}" | base64 -d > /tmp/playwright_sessions/grok_auth_state.json
          fi
          
      - name: Run Test Script
        run: npx tsx test-all-engines-live.ts
        env:
          TEST_PROMPT: ${{ github.event.inputs.prompt }}
