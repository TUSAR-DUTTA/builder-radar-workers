name: Test Single Worker - ChatGPT

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'The single prompt to test'
        required: true
        default: 'What is Builder Radar and what are its features?'

jobs:
  test-chatgpt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    env:
      PLAYWRIGHT_BROWSER_CHANNEL: chrome
      PLAYWRIGHT_HEADLESS: '0'
      PLAYWRIGHT_PROXY_SERVER: ${{ secrets.PLAYWRIGHT_PROXY_SERVER }}
      PLAYWRIGHT_PROXY_USERNAME: ${{ secrets.PLAYWRIGHT_PROXY_USERNAME }}
      PLAYWRIGHT_PROXY_PASSWORD: ${{ secrets.PLAYWRIGHT_PROXY_PASSWORD }}
      PLAYWRIGHT_SESSIONS_DIR: /tmp/playwright_sessions
      TEST_WORKER: chatgpt
      TEST_PROMPT: ${{ github.event.inputs.prompt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers and dependencies
        run: npx playwright install --with-deps chromium

      - name: Restore sessions from secrets
        run: |
          mkdir -p /tmp/playwright_sessions
          if [ -n "${{ secrets.CHATGPT_SESSION_GZ_B64 }}" ]; then
            echo "${{ secrets.CHATGPT_SESSION_GZ_B64 }}" | base64 -d | gunzip > /tmp/playwright_sessions/chatgpt_auth_state.json
          elif [ -n "${{ secrets.CHATGPT_SESSION_B64 }}" ]; then
            echo "${{ secrets.CHATGPT_SESSION_B64 }}" | base64 -d > /tmp/playwright_sessions/chatgpt_auth_state.json
          fi
          
      - name: Run Test Script
        run: npx tsx test-single-worker.ts
