name: Test Single Worker - Google AIO
on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Exact project UUID
        required: true
        type: string
      prompt_id:
        description: Exact active prompt UUID
        required: true
        type: string
jobs:
  canary:
    uses: ./.github/workflows/_consumer-canary.yml
    with:
      engine: google-aio
      project_id: ${{ inputs.project_id }}
      prompt_id: ${{ inputs.prompt_id }}
      preflight_only: true
    secrets: inherit
