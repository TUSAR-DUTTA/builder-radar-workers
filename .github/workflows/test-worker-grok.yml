name: Test Single Worker - Grok
on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Exact project UUID
        required: true
        type: string
      prompt_id:
        description: Exact active prompt UUID
        required: true
        type: string
      canary_private_commit:
        description: Exact 40-character private-core commit for this canary only
        required: true
        type: string
jobs:
  canary:
    uses: ./.github/workflows/_consumer-canary.yml
    with:
      engine: grok
      private_commit: ${{ inputs.canary_private_commit }}
      project_id: ${{ inputs.project_id }}
      prompt_id: ${{ inputs.prompt_id }}
      preflight_only: true
    secrets: inherit
