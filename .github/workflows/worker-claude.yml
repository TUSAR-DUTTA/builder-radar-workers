name: BuilderRadar Worker - Claude
on:
  schedule:
    - cron: '0 3 * * *'
  repository_dispatch:
    types: [run-workers]
  workflow_dispatch:
    inputs:
      project_id:
        description: Exact project UUID for a one-cell canary
        required: true
        type: string
      prompt_id:
        description: Exact active prompt UUID for a one-cell canary
        required: true
        type: string
concurrency:
  group: builderradar-claude-${{ inputs.project_id || 'scheduled' }}
  cancel-in-progress: false
jobs:
  run:
    uses: ./.github/workflows/_consumer-canary.yml
    with:
      engine: claude
      project_id: ${{ inputs.project_id || github.event.client_payload.project_id || '' }}
      prompt_id: ${{ inputs.prompt_id || github.event.client_payload.prompt_id || '' }}
    secrets: inherit
